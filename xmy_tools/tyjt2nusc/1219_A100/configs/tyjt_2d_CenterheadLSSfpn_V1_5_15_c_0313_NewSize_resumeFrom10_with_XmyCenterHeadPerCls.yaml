# torchpack dist-run -np 4 python tools/train.py \
#     xmy_tools/tyjt2nusc/1205_A100_doing/configs/tyjt_1218_2d_CenterheadLSSfpn_demo7000_48epoch_NewFormat.yaml \
#     --model.encoders.camera.backbone.init_cfg.checkpoint pretrained/swint-nuimages-pretrained.pth
# 
# 注意：配置文件已设置 load_from: pretrained/camera-only-det.pth，
# 因此无需在命令行重复指定 --load_from
