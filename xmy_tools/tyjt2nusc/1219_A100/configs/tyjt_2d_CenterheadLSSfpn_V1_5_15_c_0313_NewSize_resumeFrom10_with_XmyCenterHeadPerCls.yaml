# ===============================================
# BEVFusion 纯视觉3D目标检测配置文件 (tyjt数据集)
# 配置严格基于官方纯视觉(1)架构，并适配tyjt数据路径与类别
# 用于在 pretrained/camera-only-det.pth 基础上微调
# ===============================================

# ==================== 1. 基础运行配置 ====================
max_epochs: 48                   # 总训练轮数（论文标准为24epoch，小数据集可增加至120）→ 保留，与(2)相同
seed: 0                          # 随机种子 → 保留，与(2)相同
deterministic: false             # 非确定性训练 → 保留，与(2)相同
cudnn_benchmark: false           # CUDA基准测试 → 修改为false（官方纯视觉配置使用false）

# 检查点配置
checkpoint_config:
  interval: 1                    # 每1个epoch保存一次checkpoint → 保留
  max_keep_ckpts: 8              # 保留最新8个checkpoint（纯视觉模型较小，可多保留几个）
  save_last: true                # 保存最后一个checkpoint → 保留
  save_optimizer: true           # 保存优化器状态 → 保留

# 运行器配置
runner:
  type: CustomEpochBasedRunner    # 自定义epoch-based训练器（MMDetection3D标准）
  max_epochs: ${max_epochs}       # 训练总epoch数（引用上面的max_epochs变量）

# ==================== 2. 路径与数据集配置 ====================
# 数据集类型（必须与数据格式匹配）
dataset_type: NuScenesDataset

# 数据集根路径
