# 完全独立配置，无_base_继承

model:
  type: BEVFusion
  encoders:
    camera:
      backbone:
        type: SwinTransformer
        embed_dims: 96
        depths: [2, 2, 6, 2]
        num_heads: [3, 6, 12, 24]
        window_size: 7
        mlp_ratio: 4
        qkv_bias: true
        qk_scale: null
        drop_rate: 0.0
        attn_drop_rate: 0.0
        drop_path_rate: 0.2
        patch_norm: true
        out_indices: [1, 2, 3]
        with_cp: false
        convert_weights: true
        init_cfg:
          type: Pretrained
          checkpoint: 'https://github.com/SwinTransformer/storage/releases/download/v1.0.0/swin_tiny_patch4_window7_224.pth'
      neck:
        in_channels: [192, 384, 768]
      vtransform:
        xbound: [-54.0, 54.0, 0.3]
        ybound: [-54.0, 54.0, 0.3]
    lidar:
      voxelize:
        point_cloud_range: [-54.0, -54.0, -5.0, 54.0, 54.0, 3.0]
        voxel_size: [0.075, 0.075, 0.2]
        max_voxels: [120000, 160000]
      backbone:
        sparse_shape: [1440, 1440, 41]
  fuser:
    type: ConvFuser
    in_channels: [80, 256]
    out_channels: 256
  decoder:
    type: SECONDFPN
    in_channels: [256]
    out_channels: [256]
    upsample_strides: [1]
    use_conv_for_no_stride: true
  heads:
    object:
      type: TransFusionHead
      num_classes: 10
      in_channels: 256
      feat_channels: 256
      num_proposals: 200
      auxiliary: true
      train_cfg:
        grid_size: [1440, 1440, 41]
      test_cfg:
        grid_size: [1440, 1440, 41]

dataset_type: NuScenesDataset
dataset_root: /mnt/bevfusion_mit_xmy/xmy_tools/tyjt2pkl/output/step3_1/

input_modality:
  use_lidar: true
  use_camera: true
  use_radar: false
  use_map: false
  use_external: false

point_cloud_range: [-54.0, -54.0, -5.0, 54.0, 54.0, 3.0]
voxel_size: [0.075, 0.075, 0.2]

object_classes:
  - car
  - truck
  - construction_vehicle
  - bus
  - trailer
  - pedestrian
  - motorcycle
  - bicycle
  - traffic_cone
  - barrier

data:
  samples_per_gpu: 1
  workers_per_gpu: 4
  train:
    type: NuScenesDataset
    dataset_root: /mnt/bevfusion_mit_xmy/xmy_tools/tyjt2pkl/output/step3_1/
    ann_file: /mnt/bevfusion_mit_xmy/xmy_tools/tyjt2pkl/output/step3_1/tyjt_infos_train_correct.pkl
    pipeline:
      - type: LoadMultiViewImageFromFiles
        to_float32: true
      - type: LoadPointsFromFile
        coord_type: LIDAR
        load_dim: 5
        use_dim: [0, 1, 2, 3, 4]
      - type: LoadAnnotations3D
        with_bbox_3d: true
        with_label_3d: true
      - type: ObjectRangeFilter
        point_cloud_range: [-54.0, -54.0, -5.0, 54.0, 54.0, 3.0]
      - type: PointShuffle
      - type: ImageNormalize
        mean: [123.675, 116.28, 103.53]
        std: [58.395, 57.12, 57.375]
      - type: DefaultFormatBundle3D
        classes:
          - car
          - truck
          - construction_vehicle
          - bus
          - trailer
          - pedestrian
          - motorcycle
          - bicycle
          - traffic_cone
          - barrier
      - type: Collect3D
        keys: ['points', 'img', 'gt_bboxes_3d', 'gt_labels_3d']
    modality:
      use_lidar: true
      use_camera: true
      use_radar: false
      use_map: false
      use_external: false
    test_mode: false
    box_type_3d: LiDAR
    filter_empty_gt: true

  val:
    type: NuScenesDataset
    dataset_root: /mnt/bevfusion_mit_xmy/xmy_tools/tyjt2pkl/output/step3_1/
    ann_file: /mnt/bevfusion_mit_xmy/xmy_tools/tyjt2pkl/output/step3_1/tyjt_infos_val_correct.pkl
    pipeline:
      - type: LoadMultiViewImageFromFiles
        to_float32: true
      - type: LoadPointsFromFile
        coord_type: LIDAR
        load_dim: 5
        use_dim: [0, 1, 2, 3, 4]
      - type: ImageNormalize
        mean: [123.675, 116.28, 103.53]
        std: [58.395, 57.12, 57.375]
      - type: DefaultFormatBundle3D
        classes:
          - car
          - truck
          - construction_vehicle
          - bus
          - trailer
          - pedestrian
          - motorcycle
          - bicycle
          - traffic_cone
          - barrier
      - type: Collect3D
        keys: ['points', 'img']
    modality:
      use_lidar: true
      use_camera: true
      use_radar: false
      use_map: false
      use_external: false
    test_mode: true
    box_type_3d: LiDAR

optimizer:
  type: AdamW
  lr: 0.0001
  weight_decay: 0.01

lr_config:
  policy: step
  warmup: none
  step: [16, 19]

runner:
  type: EpochBasedRunner
  max_epochs: 20
