      - type: ImageNormalize  # 修改 - 配置1: ImageNormalize, 配置2: PointShuffle
        mean: [123.675, 116.28, 103.53]  # 配置2中不存在此配置
        std: [58.395, 57.12, 57.375]  # 修改 - 配置1: [58.395, 57.12, 57.375], 配置2: 
      - type: DefaultFormatBundle3D  # 修改 - 配置1: DefaultFormatBundle3D, 配置2: PointShuffle
        classes:  # 未修改 - 原数值: , 当前数值: 
          - car
          - truck
          - construction_vehicle
          - bus
          - trailer
          - pedestrian
          - motorcycle
          - bicycle
          - traffic_cone
          - barrier
      - type: Collect3D  # 修改 - 配置1: Collect3D, 配置2: PointShuffle
        keys: ['points', 'img', 'gt_bboxes_3d', 'gt_labels_3d']  # 配置2中不存在此配置
    modality:  # 未修改 - 原数值: , 当前数值: 
