      use_map: false  # 未修改 - 原数值: false, 当前数值: false
      use_external: false  # 未修改 - 原数值: false, 当前数值: false
    test_mode: false  # 未修改 - 原数值: false, 当前数值: false
    box_type_3d: LiDAR  # 未修改 - 原数值: LiDAR, 当前数值: LiDAR
