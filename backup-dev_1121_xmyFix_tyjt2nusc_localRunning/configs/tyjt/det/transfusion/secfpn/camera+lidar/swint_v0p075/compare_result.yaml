    pipeline:  # 未修改 - 原数值: , 当前数值: 
      - type: LoadMultiViewImageFromFiles  # 修改 - 配置1: LoadMultiViewImageFromFiles, 配置2: PointShuffle
        to_float32: true  # 配置2中不存在此配置
      - type: LoadPointsFromFile  # 修改 - 配置1: LoadPointsFromFile, 配置2: PointShuffle
        coord_type: LIDAR  # 未修改 - 原数值: LIDAR, 当前数值: LIDAR
        load_dim: 5  # 修改 - 配置1: 5, 配置2: 6
        use_dim: [0, 1, 2, 3, 4]  # 修改 - 配置1: [0, 1, 2, 3, 4], 配置2: 
      - type: LoadAnnotations3D  # 修改 - 配置1: LoadAnnotations3D, 配置2: PointShuffle
        with_bbox_3d: true  # 未修改 - 原数值: true, 当前数值: true
        with_label_3d: true  # 未修改 - 原数值: true, 当前数值: true
      - type: ObjectRangeFilter  # 修改 - 配置1: ObjectRangeFilter, 配置2: PointShuffle
        point_cloud_range: [-54.0, -54.0, -5.0, 54.0, 54.0, 3.0]  # 修改 - 配置1: [-54.0, -54.0, -5.0, 54.0, 54.0, 3.0], 配置2: 
