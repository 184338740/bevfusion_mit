  with_label_3d: true

- db_sampler:
    classes:
    - car
    - truck
    - bus
    - pedestrian
    - motorcycle
    - bicycle
    - construction_vehicle
    - trailer
    - traffic_cone
    - barrier
    dataset_root: /mnt/bevfusion_mit_xmy/xmy_tools/tyjt2nusc/1106_deep/output/step1/nuscenes_tyjt
    info_path: /mnt/bevfusion_mit_xmy/xmy_tools/tyjt2nusc/1106_deep/output/step1/nuscenes_tyjt/tyjt_dbinfos_train.pkl
    points_loader:
      coord_type: LIDAR
      load_dim: 5
      reduce_beams: 32
      type: LoadPointsFromFile
      use_dim: 5
    prepare:
      filter_by_difficulty:
      - -1
      filter_by_min_points:  # 修正 dpsample,  主要应对 训练集中部分类缺失的问题
        car: 5
        truck: 5
        bus: 1  # 缺失类别设为1，避免KeyError
        pedestrian: 5
        motorcycle: 5
        bicycle: 5
        construction_vehicle: 1  # 缺失类别设为1，避免KeyError
        trailer: 1  # 缺失类别设为1，避免KeyError
        traffic_cone: 1  # 缺失类别设为1，避免KeyError
        barrier: 1  # 缺失类别设为1，避免KeyError
    rate: 1.0
    sample_groups:  # 修正后的类别
      car: 2
      truck: 3
      bus: 0  # 缺失类别设为0，不采样
      pedestrian: 2
      motorcycle: 6
      bicycle: 6
      construction_vehicle: 0  # 缺失类别设为0，不采样
      trailer: 0  # 缺失类别设为0，不采样
      traffic_cone: 0  # 缺失类别设为0，不采样
      barrier: 0  # 缺失类别设为0，不采样
    stop_epoch: -1
    type: ObjectPaste

