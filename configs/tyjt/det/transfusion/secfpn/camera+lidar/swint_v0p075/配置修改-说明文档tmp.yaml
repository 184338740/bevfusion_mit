# 修改总结：
# # 配置文件各模块修改总结

# 基于第1001行至第1600行的配置内容，针对TYJT数据集的适配修改主要集中在以下几个模块：

# ## 1. 数据集与输入模态调整
# - **数据集类型**：将`NuScenesDataset`统一修改为`CustomDataset`，适配TYJT数据集格式
# - **数据路径**：将所有数据根目录和标注文件路径从`nuscenes`替换为`tyjt`
# - **输入模态**：关闭雷达数据支持（`use_radar: false`），并在所有数据处理流程中移除`radar`相关键值
# - **标注文件格式**：从`.pkl`格式改为`json`格式（`train.json`/`val.json`/`test.json`）

# ## 2. 训练参数调整
# - **学习率**：从`0.0002`降低至`0.0001`，适应TYJT数据集规模较小的特点
# - **训练轮次**：最大训练轮次从`20`增加至`30`，确保模型充分收敛
# - **学习率调度**：调整衰减里程碑从`[16, 19]`改为`[20, 25]`，适配延长的训练周期
# - **工作目录**：修改为`./work_dirs/bevfusion_tyjt`，与数据集对应

# ## 3. 数据处理流程优化
# - **数据收集配置**：在`Collect3D`模块中移除所有`radar`相关配置
# - **评估数据集**：将`NuScenesMetricDataset`改为`CustomMetricDataset`
# - **保持一致性**：所有与激光雷达、相机相关的预处理参数保持不变，确保基础功能稳定

# ## 4. 模型结构保持
# - 模型主体结构（BEVFusion框架、ResNet骨干网络、Transformer组件等）未做修改
# - 所有特征提取、BEV编码、边界框预测等核心参数保持与原配置一致
# - 多任务头配置（针对不同类别）未做调整，确保检测能力完整

# ## 5. 其他适配修改
# - 保持所有数据增强策略不变，确保模型泛化能力
# - 保留所有评估指标和日志配置，保证实验可追溯性
# - 设备配置（GPU使用、分布式训练等）保持不变，确保部署兼容性

# 这些修改主要围绕TYJT数据集的特性（无雷达数据、规模不同）进行针对性调整，同时最大限度保留了原模型的结构和能力，确保在新数据集上的有效性和性能。





