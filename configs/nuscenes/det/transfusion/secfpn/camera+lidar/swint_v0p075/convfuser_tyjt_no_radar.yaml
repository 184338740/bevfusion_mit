# 基于原始配置，彻底移除radar相关配置

# 数据路径
dataset_root: /mnt/bevfusion_mit_xmy/xmy_tools/tyjt2nusc/1106_deep/output/step1/nuscenes_tyjt/

data:
  samples_per_gpu: 1
  workers_per_gpu: 4
  
  # 训练集 - 简化配置
  train:
    type: NuScenesDataset
    dataset_root: /mnt/bevfusion_mit_xmy/xmy_tools/tyjt2nusc/1106_deep/output/step1/nuscenes_tyjt/
    ann_file: /mnt/bevfusion_mit_xmy/xmy_tools/tyjt2nusc/1106_deep/output/step1/nuscenes_tyjt/tyjt_infos_train.pkl
    pipeline:
      - type: LoadMultiViewImageFromFiles
        to_float32: true
      - type: LoadPointsFromFile
        coord_type: LIDAR
        load_dim: 5
        use_dim: [0, 1, 2, 3, 4]
      - type: LoadPointsFromMultiSweeps
        sweeps_num: 0
        use_dim: [0, 1, 2, 3, 4]
        pad_empty_sweeps: true
        remove_close: true
      - type: LoadAnnotations3D
        with_bbox_3d: true
        with_label_3d: true
      - type: GlobalRotScaleTrans
        rot_range: [-0.3925, 0.3925]
        scale_ratio_range: [0.95, 1.05]
        translation_std: [0, 0, 0]
      - type: RandomFlip3D
        flip_ratio_bev_horizontal: 0.5
      - type: PointsRangeFilter
        point_cloud_range: [-54.0, -54.0, -5.0, 54.0, 54.0, 3.0]
      - type: ObjectRangeFilter
        point_cloud_range: [-54.0, -54.0, -5.0, 54.0, 54.0, 3.0]
      - type: ObjectNameFilter
        classes: ['car', 'truck', 'construction_vehicle', 'bus', 'trailer', 
                  'barrier', 'motorcycle', 'bicycle', 'pedestrian', 'traffic_cone']
      - type: PointShuffle
      - type: DefaultFormatBundle3D
        class_names: ['car', 'truck', 'construction_vehicle', 'bus', 'trailer', 
                     'barrier', 'motorcycle', 'bicycle', 'pedestrian', 'traffic_cone']
      - type: Collect3D
        keys: ['points', 'img', 'gt_bboxes_3d', 'gt_labels_3d']
        meta_keys: ['camera_intrinsics', 'camera2ego', 'lidar2ego', 
                   'lidar2camera', 'lidar2image', 'camera2lidar',
                   'img_aug_matrix', 'lidar_aug_matrix']
    classes: ['car', 'truck', 'construction_vehicle', 'bus', 'trailer', 
              'barrier', 'motorcycle', 'bicycle', 'pedestrian', 'traffic_cone']
    modality:
      use_camera: true
      use_lidar: true
      use_radar: false
      use_map: false
      use_external: false
    test_mode: false
    use_valid_flag: true
    box_type_3d: LiDAR

  # 验证集
  val:
    type: NuScenesDataset
    dataset_root: /mnt/bevfusion_mit_xmy/xmy_tools/tyjt2nusc/1106_deep/output/step1/nuscenes_tyjt/
    ann_file: /mnt/bevfusion_mit_xmy/xmy_tools/tyjt2nusc/1106_deep/output/step1/nuscenes_tyjt/tyjt_infos_val.pkl
    pipeline:
      - type: LoadMultiViewImageFromFiles
        to_float32: true
      - type: LoadPointsFromFile
        coord_type: LIDAR
